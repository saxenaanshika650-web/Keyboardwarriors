kind = "api"
previewPath = "/api"
title = "ABTalks Interview Agent API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "uvicorn main:app --host 0.0.0.0 --port ${PORT}"

[services.production.run]
args = ["uvicorn", "main:app", "--app-dir", "artifacts/api-server", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
